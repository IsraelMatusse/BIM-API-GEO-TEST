
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Maputo
spring.jpa.hibernate.ddl-auto=validate

api.version=${API_VERSION:1.0.0}
api.connection.timeout=${API_CONNECTION_TIMEOUT:10000}
api.connection.timeout.seconds=${API_CONNECTION_TIMEOUT_SECONDS:10}
api.defaultGeoLanguage=${API_DEFAULT_GEO_LANGUAGE:pt}
api.defaultGeoResponseFormat=${API_DEFAULT_GEO_RESPONSE_FORMAT:json}
api.defaultGeoCount=${API_DEFAULT_GEO_COUNT:10}

#geo apis
geo.api.base.url=${GEO_API_BASE_URL}
geo.api.search=${GEO_API_SEARCH}


geo.api.language=${GEO_API_LANGUAGE:pt}
geo.api.response.format=${GEO_API_RESPONSE_FORMAT:json}

#wheather apis
wheather.api.base.url=${WEATHER_API_BASE_URL}
wheather.api.forecast=${WEATHER_API_FORECAST}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5